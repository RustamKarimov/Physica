name: cross-platform-ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400
      - name: Restore
        run: dotnet restore PhysicaStudio.slnx --locked-mode
      - name: Build
        run: dotnet build PhysicaStudio.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test PhysicaStudio.slnx --configuration Release --no-build

