<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Derive distributions and frequencies reproducibly</title><desc id="d">Four-bin histogram beside a one-sided amplitude spectrum peaking at two hertz.</desc><rect width="1200" height="675" fill="#07131b"/><text x="70" y="72" fill="#eef8f6" font-family="system-ui" font-size="30" font-weight="700">Derive distributions and frequencies reproducibly</text><text x="70" y="105" fill="#819ca4" font-family="monospace" font-size="15">IMMUTABLE SAMPLES → HISTOGRAM + DIRECT DFT</text><rect x="70" y="140" width="510" height="450" rx="16" fill="#0b1d26" stroke="#1b3a45"/><rect x="130" y="390" width="95" height="140" fill="#27d3c2"/><rect x="225" y="320" width="95" height="210" fill="#27d3c2"/><rect x="320" y="460" width="95" height="70" fill="#27d3c2"/><rect x="415" y="390" width="95" height="140" fill="#27d3c2"/><text x="325" y="180" fill="#eef8f6" font-family="system-ui" font-size="20" text-anchor="middle">OBSERVATION HISTOGRAM</text><text x="325" y="565" fill="#8da5ab" font-family="system-ui" font-size="15" text-anchor="middle">counts 2 · 3 · 1 · 2</text><rect x="620" y="140" width="510" height="450" rx="16" fill="#0b1d26" stroke="#1b3a45"/><path d="M680 530L730 530L780 520L830 220L880 520L930 530L980 530L1030 530L1080 530" fill="none" stroke="#ffcf70" stroke-width="5"/><circle cx="830" cy="220" r="9" fill="#ffcf70"/><text x="850" y="215" fill="#ffcf70" font-family="system-ui" font-size="21" font-weight="700">2 Hz · amplitude 1 V</text><text x="875" y="180" fill="#eef8f6" font-family="system-ui" font-size="20" text-anchor="middle">ONE-SIDED AMPLITUDE</text><text x="875" y="565" fill="#8da5ab" font-family="monospace" font-size="15" text-anchor="middle">DIRECT DFT · 16 SAMPLES · 16 Hz</text></svg>
