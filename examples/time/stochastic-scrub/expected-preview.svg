<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Stochastic checkpoint scrub</title><desc id="desc">A random-source checkpoint at two seconds reproduces four identical samples and the same final event sequence.</desc>
  <rect width="960" height="540" fill="#101522"/><text x="60" y="78" fill="#f0f5fa" font-family="system-ui" font-size="36">Stochastic checkpoint scrub</text>
  <rect x="60" y="120" width="840" height="92" rx="16" fill="#1c2838"/><text x="88" y="157" fill="#ffd166" font-family="system-ui" font-size="21">checkpoint · t = 2 s · PRNG state 2176035992 · event sequence 4</text><text x="88" y="190" fill="#aebdca" font-family="system-ui" font-size="18">Full generator state is restored — the original seed alone is insufficient.</text>
  <text x="60" y="280" fill="#9fb0bf" font-family="system-ui" font-size="20">uninterrupted</text><text x="60" y="372" fill="#9fb0bf" font-family="system-ui" font-size="20">replayed</text>
  <g fill="#65d7bd" font-family="ui-monospace, monospace" font-size="18"><rect x="245" y="247" width="150" height="48" rx="10" fill="#173b3b"/><text x="260" y="278">1882851208</text><rect x="410" y="247" width="135" height="48" rx="10" fill="#173b3b"/><text x="425" y="278">698933837</text><rect x="560" y="247" width="150" height="48" rx="10" fill="#173b3b"/><text x="575" y="278">2311737117</text><rect x="725" y="247" width="150" height="48" rx="10" fill="#173b3b"/><text x="740" y="278">3306712617</text>
  <rect x="245" y="339" width="150" height="48" rx="10" fill="#173b3b"/><text x="260" y="370">1882851208</text><rect x="410" y="339" width="135" height="48" rx="10" fill="#173b3b"/><text x="425" y="370">698933837</text><rect x="560" y="339" width="150" height="48" rx="10" fill="#173b3b"/><text x="575" y="370">2311737117</text><rect x="725" y="339" width="150" height="48" rx="10" fill="#173b3b"/><text x="740" y="370">3306712617</text></g>
  <text x="60" y="470" fill="#65d7bd" font-family="system-ui" font-size="24">Exact tail match ✓ · final event sequence 8</text>
</svg>
