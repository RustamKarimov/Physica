<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Edit notation without losing meaning</title>
  <desc id="description">A Physica equation workbench showing editable notation, canonical MathJSON and retained semantic identities.</desc>
  <rect width="1200" height="675" fill="#0a0f12"/>
  <g stroke="#1d292f" opacity=".7">
    <path d="M0 64h1200M0 128h1200M0 192h1200M0 256h1200M0 320h1200M0 384h1200M0 448h1200M0 512h1200M0 576h1200M0 640h1200"/>
  </g>
  <rect x="48" y="36" width="34" height="34" rx="2" fill="#2dc2cb"/>
  <text x="65" y="61" text-anchor="middle" fill="#071012" font-family="Georgia" font-size="25" font-weight="700">φ</text>
  <text x="97" y="59" fill="#e8edf0" font-family="Consolas, monospace" font-size="17" font-weight="700">PHYSICA</text>
  <text x="1120" y="57" text-anchor="end" fill="#7f8b90" font-family="Consolas, monospace" font-size="12">15 / SEMANTIC EQUATIONS</text>
  <text x="50" y="116" fill="#2dc2cb" font-family="Consolas, monospace" font-size="12" letter-spacing="2">EDITABLE MEANING · STABLE IDENTITY · FINAL TYPESETTING</text>
  <text x="50" y="175" fill="#e8edf0" font-family="Segoe UI, sans-serif" font-size="45" font-weight="700">Edit the notation.</text>
  <text x="50" y="220" fill="#2dc2cb" font-family="Georgia" font-size="42" font-style="italic">Keep hold of the meaning.</text>
  <rect x="50" y="266" width="1100" height="344" fill="#090d10" stroke="#354047"/>
  <path d="M525 266v344M870 266v344" stroke="#293238"/>
  <text x="75" y="302" fill="#2dc2cb" font-family="Consolas, monospace" font-size="11">01</text>
  <text x="106" y="303" fill="#e8edf0" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600">MathLive input</text>
  <rect x="75" y="335" width="420" height="88" fill="#111c21" stroke="#3a4c54"/>
  <text x="285" y="392" text-anchor="middle" fill="#eaf5f6" font-family="Georgia" font-size="29" font-style="italic">x = x₀ + ut + ½at² + bt³</text>
  <rect x="75" y="440" width="420" height="42" fill="#0e1a18"/>
  <rect x="75" y="440" width="3" height="42" fill="#78d7a9"/>
  <text x="91" y="457" fill="#78d7a9" font-family="Consolas, monospace" font-size="9">SEMANTIC PARSE VALID</text>
  <text x="91" y="473" fill="#aeb9bd" font-family="Consolas, monospace" font-size="10">unchanged subtrees retained their identities</text>
  <rect x="75" y="500" width="420" height="82" fill="#f2f0e9"/>
  <text x="90" y="520" fill="#596268" font-family="Consolas, monospace" font-size="8">KATEX FINAL RENDER · TRUST OFF</text>
  <text x="285" y="560" text-anchor="middle" fill="#11181b" font-family="Georgia" font-size="25" font-style="italic">x = x₀ + ut + ½at² + bt³</text>
  <text x="550" y="302" fill="#2dc2cb" font-family="Consolas, monospace" font-size="11">02</text>
  <text x="581" y="303" fill="#e8edf0" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600">Canonical MathJSON</text>
  <rect x="550" y="335" width="290" height="247" fill="#091014" stroke="#28363d"/>
  <text x="570" y="365" fill="#b9e9eb" font-family="Consolas, monospace" font-size="12">
    <tspan x="570" dy="0">[&quot;Equal&quot;, &quot;x&quot;,</tspan>
    <tspan x="570" dy="23">  [&quot;Add&quot;,</tspan>
    <tspan x="570" dy="23">    [&quot;Multiply&quot;, &quot;t&quot;, &quot;u&quot;],</tspan>
    <tspan x="570" dy="23">    [&quot;Multiply&quot;, 1/2, &quot;a&quot;,</tspan>
    <tspan x="570" dy="23">      [&quot;Power&quot;, &quot;t&quot;, 2]],</tspan>
    <tspan x="570" dy="23">    [&quot;Multiply&quot;, &quot;b&quot;,</tspan>
    <tspan x="570" dy="23">      [&quot;Power&quot;, &quot;t&quot;, 3]],</tspan>
    <tspan x="570" dy="23">    &quot;x_0&quot;]]</tspan>
  </text>
  <text x="895" y="302" fill="#2dc2cb" font-family="Consolas, monospace" font-size="11">03</text>
  <text x="926" y="303" fill="#e8edf0" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600">Identity contract</text>
  <g font-family="Consolas, monospace">
    <rect x="895" y="335" width="230" height="58" fill="#0a1115" stroke="#28343a"/>
    <text x="912" y="358" fill="#e8edf0" font-size="11">MATHLIVE</text>
    <text x="912" y="377" fill="#718087" font-size="10">editable LaTeX input</text>
    <rect x="895" y="402" width="230" height="58" fill="#0a1115" stroke="#28343a"/>
    <text x="912" y="425" fill="#e8edf0" font-size="11">PHYSICA</text>
    <text x="912" y="444" fill="#718087" font-size="10">canonical tree + UUID IDs</text>
    <rect x="895" y="469" width="230" height="58" fill="#0a1115" stroke="#28343a"/>
    <text x="912" y="492" fill="#e8edf0" font-size="11">KATEX</text>
    <text x="912" y="511" fill="#718087" font-size="10">stable final glyphs + MathML</text>
    <text x="895" y="559" fill="#f6c743" font-size="9">AUTHORITY</text>
    <text x="895" y="579" fill="#909a9e" font-size="10">Glyphs never own meaning.</text>
  </g>
  <text x="50" y="648" fill="#566269" font-family="Consolas, monospace" font-size="10" letter-spacing="1.5">INPUT → CANONICAL SEMANTICS → STABLE IDENTITY → FINAL RENDER</text>
</svg>
