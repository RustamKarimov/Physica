<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Substitute values with proof attached</title>
  <desc id="description">A verified substitution transforms a symbolic displacement equation into s equals twenty-eight with semantic enter and exit terms.</desc>
  <defs><linearGradient id="panel" x1="0" x2="1"><stop stop-color="#0d1b20"/><stop offset="1" stop-color="#10191e"/></linearGradient></defs>
  <rect width="1200" height="675" fill="#071014"/>
  <circle cx="64" cy="54" r="19" fill="#f2b84b"/><text x="64" y="62" text-anchor="middle" fill="#151008" font-family="Georgia" font-size="26" font-weight="700">φ</text>
  <text x="98" y="60" fill="#eef2f3" font-family="Consolas, monospace" font-size="17" font-weight="700">PHYSICA · SUBSTITUTION</text>
  <text x="1137" y="59" text-anchor="end" fill="#75868d" font-family="Consolas, monospace" font-size="12">SEMANTICS BEFORE MOTION</text>
  <text x="64" y="134" fill="#f2b84b" font-family="Consolas, monospace" font-size="11" letter-spacing="2">DECLARED VALUES · SYMBOLIC CHECK · READABLE REPLACEMENT</text>
  <text x="64" y="188" fill="#f2f4f5" font-family="Segoe UI, sans-serif" font-size="39" font-weight="700">Substitute values with proof attached</text>
  <rect x="64" y="226" width="1072" height="304" rx="8" fill="url(#panel)" stroke="#344951"/>
  <text x="98" y="270" fill="#778a91" font-family="Consolas, monospace" font-size="10">KNOWN VALUES</text>
  <g font-family="Georgia" font-style="italic" font-size="29" fill="#f8d58b">
    <rect x="98" y="291" width="128" height="62" rx="4" fill="#1c211c" stroke="#5f512f"/><text x="123" y="332">u = 3</text>
    <rect x="238" y="291" width="128" height="62" rx="4" fill="#1c211c" stroke="#5f512f"/><text x="263" y="332">t = 4</text>
    <rect x="378" y="291" width="128" height="62" rx="4" fill="#1c211c" stroke="#5f512f"/><text x="403" y="332">a = 2</text>
  </g>
  <text x="98" y="406" fill="#eff4f5" font-family="Georgia" font-style="italic" font-size="43">s = ut + ½at²</text>
  <path d="M480 401h135" stroke="#f2b84b" stroke-width="2"/><path d="M605 393l14 8-14 8" fill="#f2b84b"/>
  <text x="680" y="406" fill="#eff4f5" font-family="Georgia" font-style="italic" font-size="50">s = 28</text>
  <rect x="888" y="291" width="208" height="121" rx="5" fill="#10231f" stroke="#34775e"/>
  <text x="912" y="322" fill="#8ce1b4" font-family="Consolas, monospace" font-size="10">VERIFIED SUBSTITUTION</text>
  <text x="912" y="348" fill="#aec0c4" font-family="Consolas, monospace" font-size="10">u ↦ 3 · t ↦ 4 · a ↦ 2</text>
  <text x="912" y="374" fill="#71878e" font-family="Consolas, monospace" font-size="10">Compute Engine 0.120.0</text>
  <text x="98" y="483" fill="#75878e" font-family="Consolas, monospace" font-size="10">SYMBOLS EXIT · VALUE ENTERS · EQUAL SIGN AND SUBJECT REMAIN SEMANTICALLY MATCHED</text>
  <g font-family="Consolas, monospace" font-size="10">
    <text x="64" y="580" fill="#82949b">0%</text><text x="592" y="580" fill="#f2b84b">50%</text><text x="1104" y="580" fill="#82949b">100%</text>
    <line x1="92" y1="576" x2="1090" y2="576" stroke="#344951" stroke-width="4"/><line x1="92" y1="576" x2="615" y2="576" stroke="#f2b84b" stroke-width="4"/><circle cx="615" cy="576" r="9" fill="#f8faf9" stroke="#f2b84b" stroke-width="4"/>
  </g>
  <text x="64" y="636" fill="#718188" font-family="Consolas, monospace" font-size="11">REDUCED MOTION RESOLVES DIRECTLY TO THE READABLE TARGET</text>
</svg>
