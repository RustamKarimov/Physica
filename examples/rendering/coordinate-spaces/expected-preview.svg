  <g stroke-width="6"><path d="M110 400 H430" stroke="#b7c8d8"/><path d="M150 440 V150" stroke="#b7c8d8"/><path d="M520 390 H820" stroke="#61d7bd"/><path d="M560 430 V170" stroke="#61d7bd"/></g>
  <text x="105" y="485" fill="#b7c8d8" font-family="system-ui" font-size="24">moving frame</text><text x="555" y="485" fill="#61d7bd" font-family="system-ui" font-size="24">physical world (+y upward)</text><text x="64" y="125" fill="#f2c879" font-family="system-ui" font-size="20">Educational scale: NOT TO SCALE</text>
