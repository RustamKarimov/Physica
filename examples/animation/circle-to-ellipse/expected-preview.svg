<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description"><title id="title">Circle to ellipse</title><desc id="description">Three stages show a circle, a halfway normalized morph and the destination ellipse. A semantic match panel distinguishes geometric morph from object replacement.</desc><rect width="960" height="540" fill="#0b1013"/><text x="70" y="75" fill="#2dc2cb" font-family="monospace" font-size="17" letter-spacing="3">PHYSICA / ANIMATION 13</text><text x="70" y="140" fill="#e8edf0" font-family="Segoe UI" font-size="48" font-weight="700">Circle to ellipse</text><g fill="none" stroke-width="7"><circle cx="180" cy="300" r="58" stroke="#66747a"/><ellipse cx="470" cy="300" rx="82" ry="50" stroke="#f6c743"/><ellipse cx="760" cy="300" rx="108" ry="42" stroke="#2dc2cb"/></g><g fill="#869399" font-family="monospace" font-size="15"><text x="160" y="400">0%</text><text x="445" y="400">50%</text><text x="730" y="400">100%</text></g><g font-family="monospace" font-size="13"><rect x="650" y="438" width="240" height="44" rx="6" fill="#111b20" stroke="#314148"/><text x="670" y="465" fill="#b5c1c6">force:path → MORPH</text><rect x="380" y="438" width="240" height="44" rx="6" fill="#111b20" stroke="#314148"/><text x="400" y="465" fill="#b5c1c6">label:text → REPLACE</text></g><text x="70" y="500" fill="#67747a" font-family="monospace" font-size="13">SEMANTIC ID → COMPATIBILITY → MORPH OR TRUTHFUL REPLACEMENT</text></svg>
