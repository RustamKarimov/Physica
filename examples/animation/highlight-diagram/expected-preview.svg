<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description"><title id="title">Highlight a diagram</title><desc id="description">The upward force vector is highlighted while the horizontal velocity vector is dimmed; text states the instructional focus.</desc><rect width="960" height="540" fill="#0b1013"/><text x="70" y="75" fill="#2dc2cb" font-family="monospace" font-size="17" letter-spacing="3">PHYSICA / ANIMATION 12</text><text x="70" y="140" fill="#e8edf0" font-family="Segoe UI" font-size="48" font-weight="700">Highlight a diagram</text><circle cx="470" cy="320" r="62" fill="#26353b" stroke="#718087" stroke-width="4"/><path d="M470 320V205m0 0l-14 28m14-28l14 28" stroke="#f6c743" stroke-width="8"/><path d="M470 320H660m0 0l-30-14m30 14l-30 14" stroke="#5b666b" stroke-width="6" opacity=".35"/><text x="500" y="220" fill="#f6c743" font-family="monospace" font-size="18">FORCE / FOCUS</text><text x="560" y="375" fill="#69757a" font-family="monospace" font-size="16">velocity / context</text><text x="70" y="465" fill="#d6dde0" font-family="Segoe UI" font-size="22">Focus on the force vector; velocity remains context.</text><text x="70" y="505" fill="#67747a" font-family="monospace" font-size="13">TEXT + COLOR · TRANSIENT EMPHASIS · PHYSICS UNCHANGED</text></svg>
