<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description"><title id="title">Move, scale and rotate</title><desc id="description">Three snapshots of one square translating, rotating and scaling along a presentation timeline.</desc><rect width="960" height="540" fill="#0b1013"/><path d="M70 430H890" stroke="#344148" stroke-width="2"/><path d="M130 420v20M480 420v20M830 420v20" stroke="#2dc2cb" stroke-width="3"/><text x="70" y="78" fill="#2dc2cb" font-family="monospace" font-size="17" letter-spacing="3">PHYSICA / ANIMATION 11</text><text x="70" y="145" fill="#e8edf0" font-family="Segoe UI, sans-serif" font-size="48" font-weight="700">Move, scale and rotate</text><g fill="#2dc2cb"><rect x="100" y="275" width="60" height="60"/><rect x="435" y="245" width="90" height="90" transform="rotate(45 480 290)" opacity=".8"/><rect x="770" y="205" width="120" height="120" transform="rotate(90 830 265)" opacity=".65"/></g><g fill="#869399" font-family="monospace" font-size="14"><text x="115" y="470">0 s</text><text x="465" y="470">1 s</text><text x="815" y="470">2 s</text></g><text x="70" y="510" fill="#67747a" font-family="monospace" font-size="13">PRESENTATION TIME → PURE EVALUATION → PRESENTATION TRANSFORM</text></svg>
