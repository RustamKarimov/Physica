<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description"><title id="title">Unicode-safe label writing</title><desc id="description">A force label appears by complete grapheme clusters, preserving a combining accent and scientist emoji.</desc><rect width="960" height="540" fill="#0b1013"/><text x="70" y="75" fill="#2dc2cb" font-family="monospace" font-size="17" letter-spacing="3">PHYSICA / ANIMATION 12</text><text x="70" y="140" fill="#e8edf0" font-family="Segoe UI" font-size="46" font-weight="700">Unicode-safe label</text><text x="90" y="285" fill="#566269" font-family="Segoe UI" font-size="43">Force</text><text x="390" y="285" fill="#f6c743" font-family="Segoe UI" font-size="43">Force: é</text><text x="700" y="285" fill="#2dc2cb" font-family="Segoe UI" font-size="43">Force: é 👩‍🔬</text><g fill="#869399" font-family="monospace" font-size="15"><text x="90" y="345">5 clusters</text><text x="390" y="345">8 clusters</text><text x="700" y="345">10 clusters</text></g><text x="70" y="500" fill="#67747a" font-family="monospace" font-size="13">FULL ACCESSIBLE TEXT · VISUAL PREFIX NEVER SPLITS A GRAPHEME</text></svg>
