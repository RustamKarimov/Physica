<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description"><title id="title">Camera follows, physics does not move</title><desc id="description">A projectile follows the same parabolic world trajectory while three Camera view frames pan and zoom around it.</desc><rect width="960" height="540" fill="#0b1013"/><text x="70" y="70" fill="#2dc2cb" font-family="monospace" font-size="17" letter-spacing="3">PHYSICA / ANIMATION 14</text><text x="70" y="130" fill="#e8edf0" font-family="Segoe UI" font-size="42" font-weight="700">Camera follows, physics does not move</text><path d="M145 360 Q480 120 815 360" fill="none" stroke="#526168" stroke-width="4" stroke-dasharray="9 9"/><g fill="#f6c743"><circle cx="145" cy="360" r="11"/><circle cx="480" cy="240" r="11"/><circle cx="815" cy="360" r="11"/></g><g fill="none" stroke="#2dc2cb" stroke-width="4"><rect x="90" y="190" width="320" height="230" rx="12"/><rect x="300" y="175" width="360" height="190" rx="12"/><rect x="610" y="250" width="250" height="140" rx="12"/></g><g fill="#869399" font-family="monospace" font-size="14"><text x="105" y="448">0 s · span 8.0</text><text x="400" y="405">2 s · span 5.33</text><text x="690" y="425">4 s · span 4.0</text></g><text x="70" y="505" fill="#b5c1c6" font-family="monospace" font-size="14">WORLD PATH: UNCHANGED · CAMERA: PAN + FOLLOW + ZOOM · CLOCK: PRESENTATION</text></svg>
