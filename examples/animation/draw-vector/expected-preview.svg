<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description"><title id="title">Draw a vector</title><desc id="description">Three stages show a force vector shaft drawn by path length, with the arrow head appearing only after completion.</desc><rect width="960" height="540" fill="#0b1013"/><text x="70" y="75" fill="#2dc2cb" font-family="monospace" font-size="17" letter-spacing="3">PHYSICA / ANIMATION 12</text><text x="70" y="140" fill="#e8edf0" font-family="Segoe UI" font-size="48" font-weight="700">Draw a vector</text><g stroke="#344148" stroke-width="4"><path d="M130 390L250 230"/><path d="M420 390L540 230"/></g><path d="M710 390L830 230" stroke="#f6c743" stroke-width="7"/><path d="M830 230l-10 35m10-35l-35 6" stroke="#f6c743" stroke-width="7"/><path d="M420 390L480 310" stroke="#f6c743" stroke-width="7"/><g fill="#869399" font-family="monospace" font-size="15"><text x="165" y="440">0%</text><text x="455" y="440">50%</text><text x="745" y="440">100%</text></g><text x="70" y="500" fill="#67747a" font-family="monospace" font-size="13">PATH LENGTH → SCRUB-SAFE PREFIX → COMPLETION-ONLY HEAD</text></svg>
