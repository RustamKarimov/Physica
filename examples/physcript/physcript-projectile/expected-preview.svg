<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">PhysScript projectile authoring preview</title>
  <desc id="desc">A code panel describes a ball while a trajectory, graph, and maximum-height teaching step appear as connected authoring cards.</desc>
  <rect width="960" height="540" fill="#091114"/>
  <rect x="42" y="42" width="430" height="456" rx="8" fill="#111d21" stroke="#385057"/>
  <text x="70" y="82" fill="#58c7b7" font-family="monospace" font-size="15">PHYSSCRIPT V1 · VALID</text>
  <g fill="#d9e8e4" font-family="monospace" font-size="15">
    <text x="70" y="126">scene "Projectile explanation"</text>
    <text x="70" y="162">model Ball type physica:model/projectile-v1</text>
    <text x="70" y="198">set Ball.speed = 20 m/s</text>
    <text x="70" y="234">show trajectory of Ball</text>
    <text x="70" y="270">graph Ball.vertical_position against time</text>
    <text x="70" y="306">step "Maximum height"</text>
    <text x="70" y="342">pause simulation when velocity = 0 m/s</text>
  </g>
  <path d="M548 390 Q690 95 890 315" fill="none" stroke="#58c7b7" stroke-width="5" stroke-dasharray="10 8"/>
  <circle cx="548" cy="390" r="24" fill="#ef745e"/>
  <circle cx="738" cy="184" r="9" fill="#f2c46d"/>
  <path d="M738 174v-58" stroke="#f2c46d" stroke-width="2"/>
  <rect x="628" y="70" width="218" height="50" rx="5" fill="#e9efec"/>
  <text x="649" y="101" fill="#142328" font-family="sans-serif" font-size="15">Step: Maximum height</text>
  <text x="540" y="474" fill="#788b90" font-family="monospace" font-size="13">Declarative authoring proof · not final lesson artwork</text>
</svg>
